evaluate_comfort_rule:
  name: Vurdér Gulvkomfort-regel
  description: Vurderer én samlet komfortregel med gemt køretid og pause. Brug normalt
    blueprintfunktionen til opsætning.
  fields:
    rule_id: &id001
      name: Automation
      description: Automationens entitets-id. Blueprintfunktionen udfylder dette automatisk.
      required: true
      selector:
        entity:
          filter:
          - domain: automation
    cycle_mode:
      name: Kørselslogik
      description: Minimumperioder er den nye regel med garanteret løbetid og forlængelser.
        Ældre maksimumlogik bevares kun til allerede importerede blueprints. Blueprintet
        vælger automatisk minimumperioder.
      default: minimum
      required: false
      selector:
        select:
          options:
          - label: Minimumperioder
            value: minimum
          - label: Ældre maksimumlogik
            value: legacy_maximum
    source_mode:
      name: Temperaturgrundlag ved start
      description: 'Prognose starter, hvis en time i de næste X timer er under tændgrænsen.

        Målt temperatur kan bruges uden timeprognose. Denne vurdering bruges kun til
        at

        starte eller overtage et rum. Når kørslen er startet, ændrer nye prognoser
        den ikke.'
      default: current
      selector:
        select:
          options:
          - label: Målt udetemperatur nu
            value: current
          - label: Laveste temperatur i vejrudsigten
            value: forecast
      required: false
    source:
      name: Udeføler eller vejrudsigt
      description: 'Vælg din vejrtjeneste (weather) til timeprognose og aktuel temperatur
        som

        reserve ved stopvurdering. Prognose kræver en weather-entitet. Med Målt temperatur

        kan du også vælge en udeføler. Ved manglende startdata starter ingen rum;

        allerede aktive rum følger deres gemte perioder.'
      selector:
        entity:
          filter:
          - domain: sensor
            device_class: temperature
          - domain: weather
      required: true
    forecast_hours:
      name: Se dette antal timer frem (kun prognose)
      description: 'Fx 8 timer: kl. 18 vurderes kulde frem til kl. 02. En kold time
        kan starte

        komforten med det samme, også hvis det er varmt udenfor nu. En ny prognose
        kan

        ikke forkorte eller forlænge en allerede startet kørsel; minimumperioden og
        de

        aktuelle temperaturer ved periodens slutning bestemmer resten.'
      default: 12
      selector:
        number:
          min: 1
          max: 48
          step: 1
          unit_of_measurement: timer
          mode: box
      required: false
    floor_entities:
      name: Rum med Gulvkomfort
      description: 'Vælg rummenes Gulvkomfort-selects. Hvert rum har eget ejerskab,
        minimumperiode,

        næste stopvurdering, fastholdelse og pause. Et koldt rum holder aldrig andre
        rum i gang.

        Rum uden Gulvkomfort kan ikke styres. Den almindelige termostatstyring ændres
        ikke.'
      selector:
        entity:
          multiple: true
          filter:
          - domain: select
            integration: salus
      required: true
    level:
      name: Komfortniveau ved start
      description: 'Niveau 1–3 anvendes, når reglen tænder et slukket rum. Ved tilladt
        overtagelse

        af manuelt aktiv komfort bevares det manuelle niveau, og der sendes ingen
        unødvendig

        skrivekommando. En senere manuel niveauændring afslutter ejerskabet og starter
        pausen.'
      default: level_1
      selector:
        select:
          options:
          - label: Niveau 1
            value: level_1
          - label: Niveau 2
            value: level_2
          - label: Niveau 3
            value: level_3
      required: false
    start_below:
      name: Tænd under
      description: 'Start eller overtag et rum, når startgrundlaget er strengt under
        denne grænse,

        og rummets pause er udløbet. Fx 5 °C: 4,9 kan starte; præcis 5 starter ikke.

        Varm udetemperatur nu forhindrer ikke prognosestyret forvarmning. Celsius
        anvendes.'
      default: 5
      selector:
        number:
          min: -50
          max: 50
          step: 0.5
          unit_of_measurement: °C
          mode: box
      required: false
    min_runtime_hours:
      name: Minimumløbetid
      description: 'Fx 4 timer: efter bekræftet tænding beskyttes komforten i mindst
        fire timer.

        Ved overtagelse starter perioden ved det tjek, hvor startbetingelsen er opfyldt.

        Gentagne tjek og genstart nulstiller ikke tiden. Manuel slukning virker straks.

        Dette er en minimumperiode, ikke en maksimal samlet køretid.'
      default: 4
      selector:
        number:
          min: 0.25
          max: 168
          step: 0.25
          unit_of_measurement: timer
          mode: box
      required: false
    extension_hours:
      name: Forlængelse pr. vurdering
      description: 'Fx 1 time: er det stadig koldt ved periodens slutning, eller kræver
        dette rum

        fastholdelse, fortsætter det i endnu en hel time før næste stopvurdering.

        Bliver det varmt midt i timen, slukkes først ved timens slutning. Ved manglende

        gyldige målinger forlænges også; der gættes ikke, og ingen maksimal køretid
        gælder.'
      default: 1
      selector:
        number:
          min: 0.25
          max: 24
          step: 0.25
          unit_of_measurement: timer
          mode: box
      required: false
    stop_at:
      name: Sluk ved eller over
      description: 'Efter minimumperioden og ved slutningen af hver forlængelse kan
        rummet slukke,

        når aktuel udetemperatur er ved eller over denne grænse, og rummets egen temperatur

        ikke holder komforten aktiv. Fx 7 °C. Skal være højere end tændgrænsen.

        Der kontrolleres ikke løbende midt i en beskyttet periode.'
      default: 7
      selector:
        number:
          min: -50
          max: 60
          step: 0.5
          unit_of_measurement: °C
          mode: box
      required: false
    outdoor_sensor:
      name: Udetemperaturføler ved stop (valgfri)
      description: 'Har du en fysisk udeføler, vælges den her og bruges først ved
        stopvurdering.

        Er den tom, utilgængelig eller ugyldig, bruges vejrtjenestens aktuelle temperatur.

        Fremtidige prognosetimer bruges aldrig som stopmåling. Mangler begge kilder,

        forlænges perioden, og fejlen vises i sporingen.'
      default: ''
      selector:
        entity:
          filter:
          - domain: sensor
            device_class: temperature
      required: false
    use_room_minimum:
      name: Hold aktiv ved lav rumtemperatur
      description: 'Slå til, hvis et koldt rum skal kunne forhindre slukning ved periodens
        slutning.

        Kun allerede automatisk startede eller overtagne rum kan fastholdes; lav rumtemperatur

        tænder aldrig alene. Temperaturen læses fra SALUS-termostaten på samme enhed
        som

        rummets Gulvkomfort. Manglende eller tvetydig rumtemperatur forlænger kun
        dette rum.'
      default: false
      selector:
        boolean: {}
      required: false
    room_minimum:
      name: Minimum rumtemperatur
      description: 'Fx 21 °C: kommer et aktivt rum under grænsen, fastholder det komforten
        i sig selv.

        Den samme grænse kan gælde alle valgte rum, men temperatur, fastholdelse og
        timer er

        altid pr. rum. Ønsker du forskellige grænser, opret regler for separate rumgrupper.

        Feltet bruges kun, hvis Hold aktiv ved lav rumtemperatur er slået til.'
      default: 21
      selector:
        number:
          min: 5
          max: 35
          step: 0.5
          unit_of_measurement: °C
          mode: box
      required: false
    room_margin:
      name: Buffer før rumfastholdelse frigives
      description: 'Fx minimum 21 °C og buffer 0,5 °C: et rum, der har været under
        21, fastholdes indtil

        mindst 21,5 °C. Et rum, der ikke har udløst fastholdelse, behøver ikke nå
        21,5.

        Når fastholdelsen frigives, kan der først slukkes ved periodens slutning,
        og kun

        hvis den aktuelle udetemperatur også når slukgrænsen.'
      default: 0.5
      selector:
        number:
          min: 0.1
          max: 5
          step: 0.1
          unit_of_measurement: °C
          mode: box
      required: false
    adopt_manual:
      name: Overtag manuelt aktiveret Gulvkomfort
      description: 'Slå til for at overtage et allerede aktivt rum, når startbetingelsen
        er opfyldt,

        og rummets pause er udløbet. Bevar det manuelle niveau uden skrivning og start

        minimumperioden ved overtagelsen. Senere tjek nulstiller ikke timeren. Slået
        fra

        bevarer manuelt aktiv komfort under din egen kontrol uden automatisk slukning.'
      default: false
      selector:
        boolean: {}
      required: false
    cooldown_hours:
      name: Mindste pause før ny start
      description: 'Fx 2 timer: efter bekræftet Fra kan dette rum tidligst starte
        eller overtages

        igen to timer senere, og kun hvis startbetingelsen stadig er opfyldt. Manuel

        slukning eller niveauændring starter også en pause, så automationen ikke straks

        overtager igen. Pausen gemmes pr. rum og nulstilles ikke ved genstart.'
      default: 6
      selector:
        number:
          min: 0
          max: 168
          step: 0.25
          unit_of_measurement: timer
          mode: box
      required: false
reset_comfort_rule:
  name: Nulstil blokeret Gulvkomfort-regel
  description: Kræver bekræftet Fra på alle regelstyrede rum. Fjerner usikker kommandostatus
    og begynder en ny minimumspause uden at skrive til termostaterne.
  fields:
    rule_id: *id001
