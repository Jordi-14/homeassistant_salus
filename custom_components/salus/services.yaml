evaluate_comfort_rule:
  name: Vurdér Gulvkomfort-regel
  description: Vurderer én samlet komfortregel med gemt køretid og pause. Brug normalt
    blueprintfunktionen til opsætning.
  fields:
    rule_id: &id001
      name: Automation
      description: Automationens entitets-id. Blueprintfunktionen udfylder dette automatisk.
      required: true
      selector:
        entity:
          filter:
          - domain: automation
    source_mode:
      name: Temperaturgrundlag
      description: Målt temperatur bruger udefølerens værdi eller vejrtjenestens aktuelle
        temperatur. Prognose bruger den laveste forventede temperatur i de næste valgte
        timer. Den valgte værdi bruges både til tænd- og slukgrænsen. Prognose kan
        derfor tænde, før kulden er kommet.
      default: current
      selector:
        select:
          options:
          - label: Målt udetemperatur nu
            value: current
          - label: Laveste temperatur i vejrudsigten
            value: forecast
      required: false
    source:
      name: Udeføler eller vejrudsigt
      description: Vælg din eksisterende udendørs temperaturføler eller vejrtjeneste.
        Prognose kræver en weather-entitet med timeprognoser. En utilgængelig kilde
        tænder aldrig komforten og udløser ikke temperaturbaseret slukning; maksimal
        køretid gælder stadig. Celsius og Fahrenheit omregnes automatisk.
      selector:
        entity:
          filter:
          - domain: sensor
            device_class: temperature
          - domain: weather
      required: true
    forecast_hours:
      name: Se dette antal timer frem (kun prognose)
      description: 'Fx 12 timer: kl. 18 undersøges kl. 18–06, og komforten må tænde
        med det samme, hvis en time forventes under tændgrænsen. Dette er et rullende
        kig fremad, ikke et fast natligt tidsrum. Feltet ignoreres ved målt temperatur.
        Værdierne vurderes igen løbende; prognoser hentes højst hvert kvarter.'
      default: 12
      selector:
        number:
          min: 1
          max: 48
          step: 1
          unit_of_measurement: timer
          mode: box
      required: false
    floor_entities:
      name: Rum med Gulvkomfort
      description: Vælg de Gulvkomfort-entiteter, der skal følge reglen. Hvert rum
        har sin egen køretid og pause, så et utilgængeligt rum ikke får et andet rums
        starttid. Sæt manuelt aktiveret komfort til Fra før første brug. Rum uden
        Gulvkomfort kan ikke vælges.
      selector:
        entity:
          multiple: true
          filter:
          - domain: select
            integration: salus
      required: true
    level:
      name: Komfortniveau ved start
      description: Niveau 1–3 bruges, når reglen tænder et rum. Rummets ønskede temperatur
        ændres ikke. Hvis du manuelt ændrer niveau eller slukker under en kørsel,
        overlader reglen styringen til dig og starter minimumspausen.
      default: level_1
      selector:
        select:
          options:
          - label: Niveau 1
            value: level_1
          - label: Niveau 2
            value: level_2
          - label: Niveau 3
            value: level_3
      required: false
    start_below:
      name: Tænd under
      description: 'Komforten må tænde, når temperaturgrundlaget er lavere end denne
        grænse, rummet står på Fra, og pausen er udløbet. Fx 5 °C: præcis 5 °C tænder
        ikke; 4,9 °C kan tænde. Grænsen angives altid i Celsius.'
      default: 5
      selector:
        number:
          min: -50
          max: 50
          step: 0.5
          unit_of_measurement: °C
          mode: box
      required: false
    use_stop_temperature:
      name: Brug temperaturgrænse til slukning
      description: Slå til for at slukke ved grænsen nedenfor. Slå fra, hvis komforten
        kun skal slukkes af maksimal køretid. Mindst én slukbetingelse skal være til.
        Når begge er til, gælder den, der indtræffer først.
      default: true
      selector:
        boolean: null
      required: false
    stop_at:
      name: Sluk ved eller over
      description: Fx tænd under 5 °C og sluk ved 7 °C. Afstanden forebygger gentagne
        skift ved små udsving. Skal være højere end tændgrænsen. Ved prognose gælder
        grænsen prognosens laveste temperatur, ikke kun temperaturen lige nu. Feltet
        ignoreres, hvis temperaturslukning er slået fra.
      default: 7
      selector:
        number:
          min: -50
          max: 60
          step: 0.5
          unit_of_measurement: °C
          mode: box
      required: false
    use_max_runtime:
      name: Brug maksimal køretid
      description: Slå til for at sætte Gulvkomfort til Fra efter det valgte antal
        timer, selv om det stadig er koldt, eller vejrtjenesten er utilgængelig. Slå
        fra for kun at bruge temperaturbaseret slukning.
      default: true
      selector:
        boolean: null
      required: false
    max_runtime_hours:
      name: Maksimal køretid
      description: 'Fx 4 timer: et rum, der tændes kl. 18, får slukkommando senest
        omkring kl. 22, medmindre varmegrænsen nås tidligere. Tiden gemmes ved start
        og forlænges ikke af gentagne regelkørsler eller genstart. 0,5 time er 30
        minutter. Feltet ignoreres, hvis maksimal køretid er slået fra.'
      default: 4
      selector:
        number:
          min: 0.25
          max: 168
          step: 0.25
          unit_of_measurement: timer
          mode: box
      required: false
    cooldown_hours:
      name: Mindste pause før ny start
      description: 'Fx 6 timer: når Fra er bekræftet kl. 22, kan reglen tidligst tænde
        igen kl. 04, og kun hvis det stadig er koldt nok. Gælder uanset slukårsag.
        Pausen tælles fra bekræftet slukning, gemmes over genstart, og nul betyder
        ingen ekstra pause. En manuel niveauændring giver også en pause; reglen starter
        først automatisk igen, når rummet står på Fra.'
      default: 6
      selector:
        number:
          min: 0
          max: 168
          step: 0.25
          unit_of_measurement: timer
          mode: box
      required: false
reset_comfort_rule:
  name: Nulstil blokeret Gulvkomfort-regel
  description: Kræver bekræftet Fra på alle regelstyrede rum. Fjerner usikker kommandostatus
    og begynder en ny minimumspause uden at skrive til termostaterne.
  fields:
    rule_id: *id001
