evaluate_comfort_rule:
  name: Vurdér Gulvkomfort-regel
  description: Vurderer én samlet komfortregel med gemt køretid og pause. Brug normalt
    blueprintfunktionen til opsætning.
  fields:
    rule_id: &id001
      name: Automation
      description: Automationens entitets-id. Blueprintfunktionen udfylder dette automatisk.
      required: true
      selector:
        entity:
          filter:
          - domain: automation
    cycle_mode:
      name: Kørselslogik
      description: Minimumperioder er den nye regel med garanteret løbetid og forlængelser.
        Ældre maksimumlogik bevares kun til allerede importerede blueprints. Blueprintet
        vælger automatisk minimumperioder.
      default: minimum
      required: false
      selector:
        select:
          options:
          - label: Minimumperioder
            value: minimum
          - label: Ældre maksimumlogik
            value: legacy_maximum
    source:
      name: Vejrudsigt
      description: Vælg vejrtjenesten med timeprognoser. Den bruges altid til tænding
        og leverer også temperaturen nu, hvis der ikke er en gyldig udeføler.
      selector:
        entity:
          filter:
          - domain: weather
      required: true
    outdoor_sensor:
      name: Udetemperaturføler (valgfri)
      description: Valgfri fysisk udeføler til stopvurdering. Uden en gyldig måling
        bruges vejrtjenestens aktuelle temperatur — aldrig en fremtidig prognosetime.
      default: ''
      selector:
        entity:
          filter:
          - domain: sensor
            device_class: temperature
      required: false
    floor_entities:
      name: Rum med Gulvkomfort
      description: Vælg de rum, reglen skal styre. Hvert rum har egne timer og egen
        fastholdelse; et koldt rum holder ikke andre rum i gang.
      selector:
        entity:
          multiple: true
          filter:
          - domain: select
            integration: salus
      required: true
    level:
      name: Komfortniveau ved start
      description: Niveau ved automatisk tænding af et slukket rum. Ved overtagelse
        af allerede aktiv komfort bevares det manuelt valgte niveau.
      default: level_1
      selector:
        select:
          options:
          - label: Niveau 1
            value: level_1
          - label: Niveau 2
            value: level_2
          - label: Niveau 3
            value: level_3
      required: false
    forecast_hours:
      name: Se dette antal timer frem
      description: Hvor langt frem skal vejrudsigten undersøges? Fx 8 timer. Prognosen
        bruges kun til start og ændrer ikke en aktiv kørsel.
      default: 12
      selector:
        number:
          min: 1
          max: 48
          step: 1
          unit_of_measurement: timer
          mode: box
      required: false
    start_below:
      name: Tænd under
      description: Tænd, hvis mindst én time i prognosen er under denne grænse, og
        rummets pause er udløbet. Fx 4,9 °C kan starte ved grænse 5 °C.
      default: 5
      selector:
        number:
          min: -50
          max: 50
          step: 0.5
          unit_of_measurement: °C
          mode: box
      required: false
    min_runtime_hours:
      name: Minimumløbetid
      description: Første beskyttede periode, fx 4 timer. Starter ved bekræftet tænding
        eller ved overtagelse. Nye tjek og genstart nulstiller ikke tiden.
      default: 4
      selector:
        number:
          min: 0.25
          max: 168
          step: 0.25
          unit_of_measurement: timer
          mode: box
      required: false
    extension_hours:
      name: Forlængelse pr. vurdering
      description: Er der stadig behov ved periodens slutning, forlænges fx 1 time.
        Der foretages først en ny stopvurdering ved den nye periodes slutning.
      default: 1
      selector:
        number:
          min: 0.25
          max: 24
          step: 0.25
          unit_of_measurement: timer
          mode: box
      required: false
    stop_at:
      name: Sluk ved eller over
      description: 'Ved periodens slutning: Sluk, hvis temperaturen udenfor nu er
        ved eller over grænsen, og rummet ikke fastholdes. Skal være højere end tændgrænsen.'
      default: 7
      selector:
        number:
          min: -50
          max: 60
          step: 0.5
          unit_of_measurement: °C
          mode: box
      required: false
    use_room_minimum:
      name: Hold aktiv ved lav rumtemperatur
      description: Kun et allerede aktivt rum kan fastholdes af sin egen temperatur.
        Termostaten på samme enhed læses automatisk; rumminimum tænder aldrig alene.
      default: false
      selector:
        boolean: {}
      required: false
    room_minimum:
      name: Minimum rumtemperatur
      description: 'Fx 21 °C: Kommer et aktivt rum under grænsen, kan det holde komforten
        aktiv. Hvert rum vurderes separat, selv om grænsen er fælles.'
      default: 21
      selector:
        number:
          min: 5
          max: 35
          step: 0.5
          unit_of_measurement: °C
          mode: box
      required: false
    room_margin:
      name: Buffer før rumfastholdelse frigives
      description: 'Fx minimum 21 °C og buffer 0,5 °C: Har rummet udløst fastholdelse,
        frigives den ved 21,5 °C. Stop kan først ske ved næste periodegrænse.'
      default: 0.5
      selector:
        number:
          min: 0.1
          max: 5
          step: 0.1
          unit_of_measurement: °C
          mode: box
      required: false
    adopt_manual:
      name: Overtag manuelt aktiveret Gulvkomfort
      description: Når startbetingelsen er opfyldt og pausen udløbet, kan manuelt
        aktiv komfort overtages. Niveauet bevares; minimumperioden starter ved overtagelsen.
      default: false
      selector:
        boolean: {}
      required: false
    cooldown_hours:
      name: Mindste pause før ny start
      description: Mindste pause efter bekræftet slukning eller manuel ændring. Gælder
        både ny tænding og overtagelse. Pausen gemmes separat for hvert rum.
      default: 6
      selector:
        number:
          min: 0
          max: 168
          step: 0.25
          unit_of_measurement: timer
          mode: box
      required: false
reset_comfort_rule:
  name: Nulstil blokeret Gulvkomfort-regel
  description: Kræver bekræftet Fra på alle regelstyrede rum. Fjerner usikker kommandostatus
    og begynder en ny minimumspause uden at skrive til termostaterne.
  fields:
    rule_id: *id001
