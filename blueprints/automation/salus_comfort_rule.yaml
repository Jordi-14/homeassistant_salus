blueprint:
  name: SALUS – enkel gulvkomfort med slukgrænse og pause
  description: >-
    Én regel: koldt nok → tænd Gulvkomfort → sluk ved varmegrænsen eller maksimal
    køretid → vent minimumspausen → tillad ny start. Kræver SALUS beta b9 eller
    nyere. Timerne gemmes af integrationen og fortsætter efter HA-genstart;
    du skal ikke oprette hjælpere. Fra slukker kun Gulvkomfort, ikke rummets
    normale temperaturstyring. Brug kun én aktiv komfortregel pr. rum.
    Reglen tænder kun rum, der står på Fra; manuelt tændt komfort overtages ikke.
  domain: automation
  homeassistant:
    min_version: 2024.11.0
  source_url: https://github.com/MichaelBusackBertelsen/homeassistant_salus/blob/feature/floor-dashboard/blueprints/automation/salus_comfort_rule.yaml
  input:
    source_mode:
      name: Temperaturgrundlag
      description: >-
        Målt temperatur bruger udefølerens værdi eller vejrtjenestens aktuelle
        temperatur. Prognose bruger den laveste forventede temperatur i de næste
        valgte timer. Den valgte værdi bruges både til tænd- og slukgrænsen.
        Prognose kan derfor tænde, før kulden er kommet.
      default: current
      selector:
        select:
          options:
            - label: Målt udetemperatur nu
              value: current
            - label: Laveste temperatur i vejrudsigten
              value: forecast
    source:
      name: Udeføler eller vejrudsigt
      description: >-
        Vælg din eksisterende udendørs temperaturføler eller vejrtjeneste.
        Prognose kræver en weather-entitet med timeprognoser. En utilgængelig
        kilde tænder aldrig komforten og udløser ikke temperaturbaseret slukning;
        maksimal køretid gælder stadig. Celsius og Fahrenheit omregnes automatisk.
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
            - domain: weather
    forecast_hours:
      name: Se dette antal timer frem (kun prognose)
      description: >-
        Fx 12 timer: kl. 18 undersøges kl. 18–06, og komforten må tænde med det
        samme, hvis en time forventes under tændgrænsen. Dette er et rullende
        kig fremad, ikke et fast natligt tidsrum. Feltet ignoreres ved målt
        temperatur. Værdierne vurderes igen løbende; prognoser hentes højst hvert kvarter.
      default: 12
      selector:
        number:
          min: 1
          max: 48
          step: 1
          unit_of_measurement: timer
          mode: box
    floor_entities:
      name: Rum med Gulvkomfort
      description: >-
        Vælg de Gulvkomfort-entiteter, der skal følge reglen. Hvert rum har sin
        egen køretid og pause, så et utilgængeligt rum ikke får et andet rums
        starttid. Sæt manuelt aktiveret komfort til Fra før første brug.
        Rum uden Gulvkomfort kan ikke vælges.
      selector:
        entity:
          multiple: true
          filter:
            - domain: select
              integration: salus
    level:
      name: Komfortniveau ved start
      description: >-
        Niveau 1–3 bruges, når reglen tænder et rum. Rummets ønskede temperatur
        ændres ikke. Hvis du manuelt ændrer niveau eller slukker under en kørsel,
        overlader reglen styringen til dig og starter minimumspausen.
      default: level_1
      selector:
        select:
          options:
            - label: Niveau 1
              value: level_1
            - label: Niveau 2
              value: level_2
            - label: Niveau 3
              value: level_3
    start_below:
      name: Tænd under
      description: >-
        Komforten må tænde, når temperaturgrundlaget er lavere end denne grænse,
        rummet står på Fra, og pausen er udløbet. Fx 5 °C: præcis 5 °C tænder
        ikke; 4,9 °C kan tænde. Grænsen angives altid i Celsius.
      default: 5
      selector:
        number:
          min: -50
          max: 50
          step: 0.5
          unit_of_measurement: °C
          mode: box
    use_stop_temperature:
      name: Brug temperaturgrænse til slukning
      description: >-
        Slå til for at slukke ved grænsen nedenfor. Slå fra, hvis komforten kun
        skal slukkes af maksimal køretid. Mindst én slukbetingelse skal være til.
        Når begge er til, gælder den, der indtræffer først.
      default: true
      selector:
        boolean:
    stop_at:
      name: Sluk ved eller over
      description: >-
        Fx tænd under 5 °C og sluk ved 7 °C. Afstanden forebygger gentagne skift
        ved små udsving. Skal være højere end tændgrænsen. Ved prognose gælder
        grænsen prognosens laveste temperatur, ikke kun temperaturen lige nu.
        Feltet ignoreres, hvis temperaturslukning er slået fra.
      default: 7
      selector:
        number:
          min: -50
          max: 60
          step: 0.5
          unit_of_measurement: °C
          mode: box
    use_max_runtime:
      name: Brug maksimal køretid
      description: >-
        Slå til for at sætte Gulvkomfort til Fra efter det valgte antal timer,
        selv om det stadig er koldt, eller vejrtjenesten er utilgængelig.
        Slå fra for kun at bruge temperaturbaseret slukning.
      default: true
      selector:
        boolean:
    max_runtime_hours:
      name: Maksimal køretid
      description: >-
        Fx 4 timer: et rum, der tændes kl. 18, får slukkommando senest omkring
        kl. 22, medmindre varmegrænsen nås tidligere. Tiden gemmes ved start og
        forlænges ikke af gentagne regelkørsler eller genstart. 0,5 time er
        30 minutter. Feltet ignoreres, hvis maksimal køretid er slået fra.
      default: 4
      selector:
        number:
          min: 0.25
          max: 168
          step: 0.25
          unit_of_measurement: timer
          mode: box
    cooldown_hours:
      name: Mindste pause før ny start
      description: >-
        Fx 6 timer: når Fra er bekræftet kl. 22, kan reglen tidligst tænde igen
        kl. 04, og kun hvis det stadig er koldt nok. Gælder uanset slukårsag.
        Pausen tælles fra bekræftet slukning, gemmes over genstart, og nul betyder
        ingen ekstra pause. En manuel niveauændring giver også en pause; reglen
        starter først automatisk igen, når rummet står på Fra.
      default: 6
      selector:
        number:
          min: 0
          max: 168
          step: 0.25
          unit_of_measurement: timer
          mode: box
mode: single
max_exceeded: silent
trigger:
  - platform: time_pattern
    minutes: /1
  - platform: state
    entity_id: !input source
  - platform: state
    entity_id: !input floor_entities
  - platform: homeassistant
    event: start
action:
  - service: salus.evaluate_comfort_rule
    data:
      rule_id: "{{ this.entity_id }}"
      source: !input source
      source_mode: !input source_mode
      forecast_hours: !input forecast_hours
      floor_entities: !input floor_entities
      level: !input level
      start_below: !input start_below
      use_stop_temperature: !input use_stop_temperature
      stop_at: !input stop_at
      use_max_runtime: !input use_max_runtime
      max_runtime_hours: !input max_runtime_hours
      cooldown_hours: !input cooldown_hours
