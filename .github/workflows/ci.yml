name: CI

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install ruff (the version pinned in requirements_test.txt)
        run: pip install "$(grep '^ruff==' requirements_test.txt)"
      - name: Check for errors
        run: ruff check .

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        # pytest-homeassistant pins the matching Home Assistant release.
        run: pip install -r requirements_test.txt
      - name: Validate translation and manifest JSON
        run: |
          python -m json.tool custom_components/salus/manifest.json > /dev/null
          python -m json.tool custom_components/salus/strings.json > /dev/null
          python -m json.tool custom_components/salus/translations/en.json > /dev/null
          python -m json.tool custom_components/salus/translations/ca.json > /dev/null
      - name: Run tests
        run: pytest tests/ -q --cov=custom_components/salus --cov-report=term-missing
      - name: Compile Python files
        run: python -m compileall -q custom_components tests

  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
