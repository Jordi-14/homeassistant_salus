name: CI

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard:
    name: Dashboard browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-save --package-lock=false playwright@1.62.1 @webcomponents/scoped-custom-element-registry@0.0.10
      - run: npx playwright install --with-deps chromium
      - run: node --check custom_components/salus/frontend/salus-room-card.js
      - run: node scripts/test_dashboard_card.cjs
      - run: node scripts/test_dashboard_registration.cjs

  ruff:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      - name: Check for errors
        run: python -m ruff check .

  tests:
    name: Tests (HA ${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest version declared in hacs.json. josepy and pycares are pinned
          # because their current releases break this older Home Assistant.
          - homeassistant: "2024.11.0"
            test_plugin: "0.13.181"
            python: "3.12"
            extra_requirements: "'josepy<2' 'pycares==4.4.0'"
          - homeassistant: "2026.5.4"
            test_plugin: "0.13.333"
            python: "3.14"
            extra_requirements: ""
          - homeassistant: "2026.9.4"
            test_plugin: "0.13.367"
            python: "3.14"
            extra_requirements: ""
          - homeassistant: "2026.10.3"
            test_plugin: "0.13.374"
            python: "3.14"
            extra_requirements: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt "pytest-homeassistant-custom-component==${{ matrix.test_plugin }}" ${{ matrix.extra_requirements }}
      - name: Install this Home Assistant version's actual frontend
        run: |
          python - <<'PY'
          import importlib.resources, json, subprocess, sys
          manifest = json.loads(importlib.resources.files("homeassistant.components.frontend").joinpath("manifest.json").read_text())
          subprocess.check_call([sys.executable, "-m", "pip", "install", *manifest["requirements"]])
          PY
      - name: Validate translation and manifest JSON
        run: |
          python -m json.tool custom_components/salus/manifest.json > /dev/null
          python -m json.tool custom_components/salus/strings.json > /dev/null
          python -m json.tool custom_components/salus/translations/en.json > /dev/null
          python -m json.tool custom_components/salus/translations/ca.json > /dev/null
      - name: Run tests
        run: python -m pytest tests/ -v --cov=custom_components/salus --cov-report=term-missing
      - name: Compile Python files
        run: python -m compileall -q custom_components tests

  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
